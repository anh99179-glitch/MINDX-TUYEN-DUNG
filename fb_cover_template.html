<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindX FB Cover Template</title>
    <!-- Import font Exo 2 from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c2c2c; /* Dark background to make cover pop */
        }
        /* Kích thước chuẩn ảnh bìa Facebook: 820x312 */
        .fb-cover {
            width: 820px;
            height: 312px;
            background-color: #f9f9f9;
            font-family: 'Exo 2', sans-serif;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        /* Banner đỏ phía trên */
        .header {
            background-color: #D32F2F; /* Màu đỏ MindX */
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 85px;
            padding-top: 5px;
        }
        .header .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Nội dung chính */
        .content {
            flex: 1;
            padding: 10px 30px 5px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .section {
            display: flex;
            flex-direction: column;
            margin-bottom: 5px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: #111;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-align: center;
        }
        
        .cards {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        /* Card vị trí */
        .card {
            background: white;
            border: 2px solid #D32F2F;
            border-radius: 8px;
            padding: 8px 5px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 3px 6px rgba(211, 47, 47, 0.1);
            transition: transform 0.2s;
        }
        .card span {
            font-size: 13px;
            font-weight: 700;
            color: #333;
            line-height: 1.3;
        }
        
        /* Chỉnh độ rộng tối đa cho khối BO (vì có 3 thẻ) */
        .cards-bo .card {
            max-width: 220px;
        }
        
        /* Nút Apply Now */
        .apply-btn-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .apply-btn {
            background-color: #D32F2F;
            color: white;
            padding: 7px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 4px 8px rgba(211, 47, 47, 0.4);
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="fb-cover">
        <!-- Banner Đỏ -->
        <div class="header">
            <div class="logo">MindX</div>
            <h1>Tuyển dụng tháng 6</h1>
        </div>

        <!-- Các khối tuyển dụng -->
        <div class="content">
            <!-- Khối BO -->
            <div class="section">
                <div class="section-title">BACK OFFICE</div>
                <div class="cards cards-bo">
                    <div class="card"><span>Kế Toán Thuế</span></div>
                    <div class="card"><span>SEO Executive</span></div>
                    <div class="card"><span>Digital Marketing</span></div>
                </div>
            </div>

            <!-- Khối SO -->
            <div class="section">
                <div class="section-title">Khối SO (Kinh doanh và vận hành)</div>
                <div class="cards cards-so">
                    <div class="card"><span>Quản lý<br>Trung tâm</span></div>
                    <div class="card"><span>Trưởng nhóm<br>Chăm sóc Khách hàng</span></div>
                    <div class="card"><span>Tư vấn<br>Tuyển sinh</span></div>
                    <div class="card"><span>Chăm sóc<br>Khách hàng</span></div>
                </div>
            </div>
        </div>

        <div class="apply-btn-container">
            <div class="apply-btn">Apply Now ➔</div>
        </div>
    </div>

</body>
</html>
