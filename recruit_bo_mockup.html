<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>MindX – Back Office Recruitment</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#2c2c2c;display:flex;justify-content:center;align-items:center;height:100vh;}
    .cover{width:1200px;height:630px;background:#fff;position:relative;overflow:hidden;
           box-shadow:0 10px 30px rgba(0,0,0,0.5);font-family:'Montserrat',sans-serif;}
    .shape{position:absolute;top:-50px;right:-250px;width:600px;height:730px;background:#D32F2F;
           border-radius:50% 0 0 50%;opacity:0.15;}
    .content{position:relative;z-index:2;padding-top:35px;text-align:center;color:#333;}
    .logo{font-family:'Anton',sans-serif;font-size:42px;color:#D32F2F;letter-spacing:2px;margin-bottom:15px;}
    .subtitle{font-size:40px;font-weight:700;color:#3b3b3b;letter-spacing:4px;margin-bottom:0;}
    .title{font-family:'Anton',sans-serif;font-size:96px;color:#D32F2F;letter-spacing:2px;margin-bottom:5px;}
    .question{font-size:28px;font-weight:600;color:#2a2a2a;margin-bottom:40px;}
    .features{display:flex;gap:25px;justify-content:center;margin-bottom:35px;}
    .card{background:#fff;border-radius:20px;padding:20px 30px;box-shadow:0 5px 15px rgba(0,0,0,0.07);
          width:260px;display:flex;flex-direction:column;align-items:center;}
    .icon{background:#D32F2F;color:#fff;width:70px;height:70px;border-radius:50%;
          display:flex;justify-content:center;align-items:center;font-size:30px;margin-bottom:15px;}
    .role{font-size:22px;font-weight:800;color:#222;text-align:center;}
    .contact{display:flex;justify-content:center;align-items:center;margin-top:30px;}
    .contact .left{font-size:18px;padding:10px 20px;background:#fff;border:2px solid #222;}
    .contact .right{font-size:18px;padding:10px 20px;background:#D32F2F;color:#fff;border-left:2px solid #222;}
  </style>
</head>
<body>
<div class="cover">
  <div class="shape"></div>
  <div class="content">
    <div class="logo">MindX</div>
    <div class="subtitle">Back Office</div>
    <div class="title">Bản Tin Tuyển Dụng</div>
    <div class="question">Tháng 6 này MindX có gì?</div>

    <div class="features">
      <div class="card">
        <div class="icon"><i class="fas fa-calculator"></i></div>
        <div class="role">KẾ TOÁN THUẾ</div>
      </div>
      <div class="card">
        <div class="icon"><i class="fas fa-search"></i></div>
        <div class="role">SEO EXECUTIVE</div>
      </div>
      <div class="card">
        <div class="icon"><i class="fas fa-bullhorn"></i></div>
        <div class="role">DIGITAL MARKETING</div>
      </div>
    </div>

    <div class="contact">
      <div class="left">Send your CV to</div>
      <div class="right">tuyendung@mindx.edu.vn</div>
    </div>
  </div>
</div>
</body>
</html>
